services:
  nginx-proxy:
    image: nginx:alpine
    container_name: datn-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - datn-network

networks:
  datn-network:
    name: datn-network
    driver: bridge
