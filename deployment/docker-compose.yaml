services:
  mysql:
    image: mysql:8.0
    container_name: datn-mysql
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root_password}
      MYSQL_DATABASE: ${DB_NAME:-ecommerce_db}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - datn-network

  analyze-server:
    image: nguyenkiet32/analyze-server:${IMAGE_TAG:-latest}
    container_name: datn-analyze-server
    pull_policy: always
    restart: unless-stopped
    env_file:
      - env
    environment:
      PORT: 8088
      NODE_ENV: ${NODE_ENV:-production}
      MAIN_BACKEND_URL: http://ecommerce-server:8080
      SEARCH_MODE: ${SEARCH_MODE:-ram}
      ENABLE_RERANK: ${ENABLE_RERANK:-true}
      MODEL_INFERENCE_URL: ${MODEL_INFERENCE_URL:-}
      MODEL_INFERENCE_TIMEOUT_MS: ${MODEL_INFERENCE_TIMEOUT_MS:-45000}
      MODEL_IMAGE_TIMEOUT_MS: ${MODEL_IMAGE_TIMEOUT_MS:-60000}
      REC_TIME_DECAY_LAMBDA: ${REC_TIME_DECAY_LAMBDA:-0.03}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - datn-network

  analyze-gui:
    image: nguyenkiet32/analyze-gui:${IMAGE_TAG:-latest}
    container_name: datn-analyze-gui
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - analyze-server
    networks:
      - datn-network

  shipment-server:
    image: nguyenkiet32/shipment-server:${IMAGE_TAG:-latest}
    container_name: datn-shipment-server
    pull_policy: always
    restart: unless-stopped
    env_file:
      - env
    environment:
      PORT: 8090
      PORT_SHIPMENT: 8090
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      ACCESS_TOKEN_SECRET: ${SHIPMENT_ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${SHIPMENT_REFRESH_TOKEN_SECRET}
    networks:
      - datn-network

  shipment-gui:
    image: nguyenkiet32/shipment-gui:${IMAGE_TAG:-latest}
    container_name: datn-shipment-gui
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - shipment-server
    networks:
      - datn-network

  ecommerce-server:
    image: nguyenkiet32/ecommerce-server:${IMAGE_TAG:-latest}
    container_name: datn-ecommerce-server
    pull_policy: always
    restart: unless-stopped
    env_file:
      - env
    environment:
      PORT: 8080
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      ANALYTICS_SERVICE_URL: http://analyze-server:8088
      ANALYTICS_SERVICE_TIMEOUT_MS: ${ANALYTICS_SERVICE_TIMEOUT_MS:-60000}
      UTE_SHIPMENT_SERVICE_URL: http://shipment-server:8090
    depends_on:
      analyze-server:
        condition: service_started
      shipment-server:
        condition: service_started
    networks:
      - datn-network

  ecommerce-gui:
    image: nguyenkiet32/ecommerce-gui:${IMAGE_TAG:-latest}
    container_name: datn-ecommerce-gui
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - ecommerce-server
    networks:
      - datn-network

  qwen-inference:
    image: nguyenkiet32/qwen-inference:${MODEL_IMAGE_TAG:-model-v1}
    container_name: datn-qwen-inference
    profiles: ["model"]
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MODEL_NAME: Qwen/Qwen3-VL-Embedding-2B
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    networks:
      - datn-network

volumes:
  mysql_data:
  huggingface_cache:

networks:
  datn-network:
    name: datn-network
    driver: bridge
