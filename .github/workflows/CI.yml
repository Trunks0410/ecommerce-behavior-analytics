name: Build & Push Docker Images on Main Tag

# Kích hoạt khi phát hiện tag mới được push lên GitHub
on:
  push:
    tags:
      - "*"

env:
  DOCKER_REPO: nguyenkiet32/datn

jobs:
  # STAGE 1: Xác thực tag nằm trên nhánh main
  verify-main-tag:
    name: Stage 1 - Verify Tag on main
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kiểm tra tag thuộc nhánh main
        id: meta
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} không nằm trên nhánh main. Hủy build!"
            exit 1
          fi
          echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "Verified tag ${GITHUB_REF_NAME} on main."

  # STAGE 2: Build từng service và push lên Docker Hub (nguyenkiet32/datn)
  build-and-push:
    name: Stage 2 - Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: verify-main-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ecommerce-backend
            context: ./Ecommerce-platform/backend
          - service: ecommerce-frontend
            context: ./Ecommerce-platform/frontend
          - service: analytics-backend
            context: ./analytics-platform/backend
          - service: analytics-frontend
            context: ./analytics-platform/frontend
          - service: shipment-backend
            context: ./shipment/backend
          - service: shipment-frontend
            context: ./shipment/frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'nguyenkiet32' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}:${{ matrix.service }}-${{ needs.verify-main-tag.outputs.tag_name }}
            ${{ env.DOCKER_REPO }}:${{ matrix.service }}-latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
