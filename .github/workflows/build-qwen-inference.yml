name: Build & Push Qwen3-VL Inference Image (On-Demand)

# Chỉ chạy khi bấm thủ công (workflow_dispatch) hoặc push tag bắt đầu bằng model-*
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag phiên bản cho qwen-inference (vd: model-v1.0.0)"
        required: false
        default: "latest"
        type: string
  push:
    tags:
      - "model-*"

env:
  DOCKER_NAMESPACE: nguyenkiet32

jobs:
  build-qwen-inference:
    name: Build & Push (qwen-inference)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'nguyenkiet32' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Xác định tag image
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.image_tag || 'latest' }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push qwen-inference
        uses: docker/build-push-action@v6
        with:
          context: ./analytics-platform/model-service
          file: ./analytics-platform/model-service/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.DOCKER_NAMESPACE }}/qwen-inference:${{ steps.tag.outputs.version }}
            ${{ env.DOCKER_NAMESPACE }}/qwen-inference:latest
          cache-from: type=gha,scope=qwen-inference
          cache-to: type=gha,mode=max,scope=qwen-inference
